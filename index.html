<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  
  <title>SUYAIV Mining</title>

<p id="userInfo">Loading user...</p>
  
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .app {
      max-width: 420px;
      margin: auto;
    }

    h1 {
      margin-top: 30px;
      font-size: 30px;
    }

    .card {
      margin-top: 25px;
      padding: 25px;
      border-radius: 20px;
      background: #1f2937;
    }

    .balance {
      font-size: 36px;
      font-weight: bold;
      margin: 15px 0;
    }

    .rate {
      color: #9ca3af;
      margin-bottom: 10px;
    }

    .timer {
      color: #9ca3af;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>SUYAIV Mining</h1>

    <div class="card">

      <p>Your Balance</p>

      <div class="balance">
        <span id="balance">0.00</span> SYV
      </div>

      <div class="rate">
        Mining Rate: 1 SYV / hour
      </div>

      <div class="timer" id="timer">
        Mining is not active
      </div>

      <button id="mineButton" onclick="startMining()">
        Start Mining
      </button>

    </div>

  </div>

  <script>

    let balance = 0;
    let mining = false;
    let startTime = 0;

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const user = tg.initDataUnsafe.user;

if (user) {
  const name = user.first_name || "User";
  const username = user.username ? "@" + user.username : "";

  document.getElementById("userInfo").innerText =
    "Welcome, " + name + " " + username;
}
    
    const miningRatePerSecond = 1 / 3600;

    function updateScreen() {

      document.getElementById("balance").innerText =
        balance.toFixed(6);

    }

    function startMining() {

      if (mining) {
        return;
      }

      mining = true;
      startTime = Date.now();

      const button = document.getElementById("mineButton");

      button.innerText = "Mining Active";
      button.disabled = true;

      document.getElementById("timer").innerText =
        "Mining is running...";

      setInterval(function() {

        balance += miningRatePerSecond;

        updateScreen();

      }, 1000);

    }

    updateScreen();

  </script>

</body>
</html>
