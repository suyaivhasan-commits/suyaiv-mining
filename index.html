<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <title>SUYAIV Mining</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .app {
      max-width: 420px;
      margin: auto;
    }

    h1 {
      margin-top: 30px;
    }

    .card {
      margin-top: 25px;
      padding: 25px;
      border-radius: 20px;
      background: #1f2937;
    }

    .balance {
      font-size: 36px;
      font-weight: bold;
      margin: 15px 0;
    }

    .rate {
      color: #9ca3af;
    }

    .status {
      margin: 20px 0;
      color: #9ca3af;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>SUYAIV Mining</h1>

  <p id="userInfo">Connecting...</p>

  <div class="card">

    <p>Your Balance</p>

    <div class="balance">
      <span id="balance">0.000000</span> SYV
    </div>

    <div class="rate">
      Mining Rate: 1 SYV / hour
    </div>

    <div class="status" id="status">
      Connecting to server...
    </div>

    <button id="mineButton" onclick="startMining()">
      Start Mining
    </button>

  </div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const FUNCTION_URL =
  "https://vsfmhezdaetjxhudjkay.supabase.co/functions/v1/telegram-user";

let mining = false;
let balance = 0;

const user = tg.initDataUnsafe.user;

if (user) {
  const name = user.first_name || "User";
  const username = user.username
    ? " @" + user.username
    : "";

  document.getElementById("userInfo").innerText =
    "Welcome to SUYAIV Mining, " + name + username;
}

async function connectUser() {

  try {

    if (!tg.initData) {
      document.getElementById("status").innerText =
        "Please open this app inside Telegram.";

      return;
    }

    const response = await fetch(FUNCTION_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        initData: tg.initData
      })

    });

    const result = await response.json();

    if (!response.ok || !result.ok) {
      throw new Error(result.error || "Connection failed");
    }

    balance = Number(result.user.balance || 0);

    mining = Boolean(result.user.mining_active);

    document.getElementById("balance").innerText =
      balance.toFixed(6);

    if (mining) {

      document.getElementById("mineButton").innerText =
        "Mining Active";

      document.getElementById("mineButton").disabled = true;

      document.getElementById("status").innerText =
        "Mining is active";

    } else {

      document.getElementById("status").innerText =
        "Ready to start mining";

    }

  } catch (error) {

    console.error(error);

    document.getElementById("status").innerText =
      "Server connection failed";

  }

}

function startMining() {

  if (mining) {
    return;
  }

  mining = true;

  document.getElementById("mineButton").innerText =
    "Mining Active";

  document.getElementById("mineButton").disabled =
    true;

  document.getElementById("status").innerText =
    "Mining started";

}

connectUser();

</script>

</body>
</html>
